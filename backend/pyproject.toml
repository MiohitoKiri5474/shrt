[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.14.0",
    "asyncpg>=0.30.0",
    "email-validator>=2.3.0",
    "fastapi>=0.141.1",
    "greenlet>=3.5.4",
    "bcrypt>=4.0.0",
    "PyJWT>=2.8.0",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0.51",
    "uvicorn[standard]>=0.52.0",
    "pytest-cov>=7.1.0",
    "slowapi>=0.1.10",
    "redis>=8.1.0,<9",
    "starlette>=1.5.0",
    "segno>=1.6.6",
]

[dependency-groups]
dev = [
    "coverage>=7.15.2",
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["src"]
omit = ["tests/*"]
# Use sys.monitoring for accurate async/await coverage on Python 3.12+
core = "sysmon"

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "pass",
    "\\.\\.\\.",
]
