name: shrt

services:
  redis:
    image: redis:7-alpine
    container_name: shrt-redis
    # Persistence disabled intentionally: rate-limit counters need not survive Redis restarts.
    # Multi-worker consistency is achieved by all workers sharing this Redis instance.
    user: "999:1000"
    command: ["redis-server", "--save", "", "--appendonly", "no", "--requirepass", "${REDIS_PASSWORD}", "--maxmemory", "100mb", "--maxmemory-policy", "allkeys-lru"]
    expose:
      - "6379"
    networks:
      - app-net
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "-a",
          "${REDIS_PASSWORD}",
          "--no-auth-warning",
          "ping",
        ]
      interval: 15s
      timeout: 5s
      retries: 3

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: shrt-backend
    environment:
      - SECRET_KEY=${SECRET_KEY}
      - DATABASE_URL=${DATABASE_URL:-sqlite+aiosqlite:///./data/shortener.db}
      - APP_ENV=${APP_ENV:-production}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-}
      - DEFAULT_USER_EMAIL=${DEFAULT_USER_EMAIL}
      - DEFAULT_USER_PASSWORD=${DEFAULT_USER_PASSWORD}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - TRUSTED_PROXY_CIDRS=${TRUSTED_PROXY_CIDRS}
    volumes:
      # Bind mount, not a named volume: `docker compose down -v` deletes named
      # volumes, which was silently wiping the SQLite DB. Host dir must be
      # writable by uid 10001 (the container's appuser) — on Linux hosts run
      # `mkdir -p ./backend-data && chown 10001:10001 ./backend-data` first.
      - ./backend-data:/app/data
    expose:
      - "8000"
    networks:
      - app-net
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: shrt-frontend
    user: "101:101"
    ports:
      - "${HOST_PORT:-80}:80"
    networks:
      - app-net
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M

networks:
  app-net:
    driver: bridge
