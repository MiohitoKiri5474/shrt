name: shrt

services:
  redis:
    # redis:7-alpine, digest resolved 2026-07-04
    image: redis:7-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    container_name: shrt-redis
    # Persistence disabled intentionally: rate-limit counters need not survive Redis restarts.
    # Multi-worker consistency is achieved by all workers sharing this Redis instance.
    # requirepass/maxmemory/save/appendonly live in the mounted redis.conf (copy
    # redis/redis.conf.example -> redis/redis.conf, not committed) instead of the
    # process command line, so the password never shows up in `docker inspect` /
    # `ps aux` / `/proc/1/cmdline`.
    user: "999:1000"
    environment:
      # redis-cli (used by the healthcheck) reads the password from this env var
      # instead of a `-a` command-line argument.
      - REDISCLI_AUTH=${REDIS_PASSWORD}
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    volumes:
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    expose:
      - "6379"
    networks:
      - app-net
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "--no-auth-warning",
          "ping",
        ]
      interval: 15s
      timeout: 5s
      retries: 3

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: shrt-backend
    environment:
      - SECRET_KEY=${SECRET_KEY}
      - DATABASE_URL=${DATABASE_URL:-sqlite+aiosqlite:///./data/shortener.db}
      - APP_ENV=${APP_ENV:-production}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-}
      - DEFAULT_USER_EMAIL=${DEFAULT_USER_EMAIL}
      - DEFAULT_USER_PASSWORD=${DEFAULT_USER_PASSWORD}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - TRUSTED_PROXY_CIDRS=${TRUSTED_PROXY_CIDRS}
    volumes:
      # Bind mount, not a named volume: `docker compose down -v` deletes named
      # volumes, which was silently wiping the SQLite DB. Host dir must be
      # writable by uid 10001 (the container's appuser) — on Linux hosts run
      # `mkdir -p ./backend-data && chown 10001:10001 ./backend-data` first.
      - ./backend-data:/app/data
    expose:
      - "8000"
    networks:
      - app-net
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: shrt-frontend
    user: "101:101"
    ports:
      - "${HOST_PORT:-80}:80"
    networks:
      - app-net
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    # Explicit mode is required: the short `tmpfs:` list form inherits the mode
    # of whatever directory already exists at each path in the base image (755
    # for /var/cache/nginx and /var/log/nginx in nginx:alpine), which blocks the
    # non-root nginx user (101) from writing there. Force 1777 so nginx can.
    volumes:
      - type: tmpfs
        target: /var/cache/nginx
        tmpfs:
          mode: 0o1777
      - type: tmpfs
        target: /var/run
        tmpfs:
          mode: 0o1777
      - type: tmpfs
        target: /var/log/nginx
        tmpfs:
          mode: 0o1777
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M

networks:
  app-net:
    driver: bridge
