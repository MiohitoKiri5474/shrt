version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/backend"
    schedule:
      interval: "weekly"
    labels:
      - "security"
      - "dependencies"

  - package-ecosystem: "bun"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    labels:
      - "security"
      - "dependencies"
    ignore:
      # TypeScript 7 drops the `typescript/lib/tsc` export vue-tsc depends on
      # (ERR_PACKAGE_PATH_NOT_EXPORTED). No vue-tsc release supports it yet —
      # see vuejs/language-tools#5381 (open) / #6123 (fix merged, unreleased).
      # Remove once vue-tsc ships the fix and the upgrade has been verified.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "security"
      - "dependencies"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "security"
      - "dependencies"

  - package-ecosystem: "docker"
    directory: "/backend"
    schedule:
      interval: "weekly"
    labels:
      - "security"
      - "dependencies"

  - package-ecosystem: "docker"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    labels:
      - "security"
      - "dependencies"
